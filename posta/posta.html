<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotta - Crea Contenuto</title>
    <link rel="icon" href="https://i.ibb.co/b5HgvzCB/Spottio-Logo-2.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="posta.css">
    <link rel="stylesheet" href="../impostazioni/body.css">
</head>
<body class="bg-[#f9fafb] flex min-h-screen">
    
    <!-- Navigazione a sinistra -->
    <div id="sidebar-container" class="w-1/5 bg-white p-6 rounded-r-2xl shadow-xl flex flex-col justify-start items-start sticky top-0 h-screen overflow-y-auto custom-scrollbar transition-all duration-300">
        <h2 id="menu-title" class="text-2xl font-bold text-gray-800 mb-6 w-full"></h2>
        <div id="nav-container" class="w-full"></div>
    </div>

    <!-- Contenuto Principale -->
    <div class="flex-grow p-4 flex justify-center items-start pt-12 overflow-y-auto">
        <div class="w-full max-w-md space-y-6">
            
            <!-- SELETTORE SPOT / SPOTINI / FLASHSPOT -->
            <div class="flex bg-gray-200 rounded-xl p-1 mb-2">
                <button type="button" id="btn-type-post" class="w-1/3 py-2 rounded-lg bg-white shadow text-sm font-bold text-gray-800 transition" onclick="window.toggleCreationType && window.toggleCreationType('post')">Spot</button>
                <button type="button" id="btn-type-spotino" class="w-1/3 py-2 rounded-lg text-sm font-bold text-gray-500 hover:text-gray-800 transition" onclick="window.toggleCreationType && window.toggleCreationType('spotino')">Spotini</button>
                <button type="button" id="btn-type-story" class="w-1/3 py-2 rounded-lg text-sm font-bold text-gray-500 hover:text-gray-800 transition" onclick="window.toggleCreationType && window.toggleCreationType('flashspot')">Flashspot</button>
            </div>

            <!-- IMPOSTAZIONI FLASHSPOT -->
            <div id="story-settings-panel" class="hidden bg-gradient-to-r from-purple-50 to-pink-50 p-4 rounded-2xl border border-purple-100 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-purple-900 mb-1">Durata Visibilità</label>
                    <select id="story-duration" class="w-full p-2.5 bg-white rounded-xl border border-purple-200 focus:outline-none focus:ring-2 focus:ring-purple-400 text-sm text-gray-700 font-medium">
                        <option value="1">1 Ora</option>
                        <option value="6">6 Ore</option>
                        <option value="12">12 Ore</option>
                        <option value="18">18 Ore</option>
                        <option value="24" selected>24 Ore</option>
                        <option value="permanent">Per sempre (In Evidenza)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-purple-900 mb-1">Raccolta / Cartella (Opzionale)</label>
                    <input type="text" id="story-folder" placeholder="Es. Ricordi, Viaggi, Musica..." class="w-full p-2.5 bg-white rounded-xl border border-purple-200 focus:outline-none focus:ring-2 focus:ring-purple-400 text-sm text-gray-700">
                    <p class="text-[10px] text-purple-600 mt-1">Raggruppa i tuoi Flashspot in cartelle sul profilo.</p>
                </div>
            </div>

            <form id="public-post-form" class="space-y-4">
                <!-- Testo -->
                <div class="bg-[#f3f4f6] rounded-2xl p-4">
                    <textarea id="post-text" rows="4" 
                        class="w-full p-2 bg-[#f3f4f6] rounded-lg text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-0 resize-none"
                        placeholder="Racconta qualcosa..."></textarea>
                </div>

                <div id="file-name" class="text-xs text-gray-500 px-2 italic mb-2"></div>

                <!-- Container Anteprime -->
                <div id="media-preview-container" class="grid grid-cols-3 gap-3 mb-4 hidden"></div>

                <!-- Durata Visibilità Effimera (Spot e Spotini) -->
                <div id="post-duration-section" class="bg-gray-50 p-3.5 rounded-2xl border border-gray-200">
                    <label class="block text-xs font-semibold text-gray-700 mb-1 flex items-center gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        Durata Visibilità Contenuto
                    </label>
                    <select id="post-duration" class="w-full p-2 bg-white rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-800 text-xs text-gray-700 font-medium">
                        <option value="permanent" selected>Per sempre (Permanente)</option>
                        <option value="2">2 Ore (Effimero)</option>
                        <option value="6">6 Ore (Effimero)</option>
                        <option value="12">12 Ore (Effimero)</option>
                        <option value="24">24 Ore (1 Giorno)</option>
                        <option value="48">48 Ore (2 Giorni)</option>
                    </select>
                </div>

                <!-- Categorie feed (visibili per Spot e Spotini, nascoste per Flashspot) -->
                <div id="category-section" class="relative">
                    <div id="selected-categories-container" class="flex flex-wrap gap-2 mb-2"></div>

                    <div class="relative">
                        <input type="text" id="category-search" 
                            class="w-full p-3 bg-[#f3f4f6] rounded-xl border-none focus:ring-2 focus:ring-blue-500 text-gray-700 pr-10 transition placeholder:transition-colors" 
                            placeholder="Cerca o inserisci una categoria... (Max 5)" 
                            autocomplete="off" />
                        <span class="absolute right-3 top-3.5 text-gray-400 pointer-events-none">&#9660;</span>
                    </div>

                    <!-- Messaggio di alert contestuale integrato nella barra -->
                    <div id="category-warning-msg" class="hidden text-xs text-red-500 font-semibold mt-1 px-1 flex items-center gap-1 animate-pulse">
                        <svg class="w-3.5 h-3.5 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                        </svg>
                        <span>Hai raggiunto il limite massimo di 5 categorie.</span>
                    </div>

                    <div id="category-dropdown" class="hidden absolute left-0 right-0 mt-1 bg-white border border-gray-200 rounded-xl shadow-lg z-50 max-h-48 overflow-y-auto custom-scrollbar">
                        <div id="category-list" class="py-1"></div>
                        <div id="add-category-option" class="hidden border-t border-gray-100 p-2 hover:bg-blue-50 cursor-pointer text-blue-600 font-semibold text-sm flex items-center gap-2 transition">
                            <span>+ Aggiungi "<span id="new-cat-name"></span>"</span>
                        </div>
                    </div>
                </div>

                <input type="hidden" id="post-category">

                <!-- Media & Pubblica -->
                <div class="pt-2 space-y-3">
                    <label id="drop-zone" for="file-upload" class="cursor-pointer w-full bg-[#e8e4f9] hover:bg-[#ddd8f3] text-[#4a34b8] border-2 border-dashed border-transparent hover:border-[#4a34b8] font-semibold py-6 px-6 rounded-2xl flex flex-col justify-center items-center gap-2 transition-all duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                        </svg>
                        <span class="text-center">Clicca o trascina qui i media<br><span class="text-xs font-normal text-gray-500">(Max 10 foto/video)</span></span>
                        <input id="file-upload" type="file" class="hidden" accept="image/*,video/*" multiple />
                    </label>

                    <button type="submit" id="submit-btn" class="w-full bg-[#212121] hover:bg-black text-white font-bold py-4 px-6 rounded-2xl transition-all hover:shadow-lg">
                        Spotta
                    </button>
                </div>
            </form>
            
            <div id="status-message" class="mt-4 text-center text-sm font-medium" style="display:none;"></div>
        </div>
    </div>

    <!-- Script Base e Comuni -->
    <script src="../core/load-firebase.js"></script>
    <script src="../core/load-shared-scripts.js"></script>

    <!-- Script della Pagina: Caricamento nell'ordine di dipendenza corretto -->
    <script src="posta-publish.js"></script>
    <script src="posta-categories.js"></script>
    <script src="posta-media.js"></script>
    
    <!-- Navigazione Globale -->
    <script src="../core/load-nav-scripts.js"></script>
</body>
</html>
