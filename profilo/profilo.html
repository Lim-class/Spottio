<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="profileTitle">Profilo - Spottio</title>
    <link rel="icon" href="https://i.ibb.co/b5HgvzCB/Spottio-Logo-2.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../impostazioni/body.css">
</head>
<body class="flex min-h-screen bg-gray-50">

    <!-- Navigazione a sinistra -->
    <div id="sidebar-container" class="w-1/5 bg-white p-6 rounded-r-2xl shadow-xl flex flex-col justify-start items-start sticky top-0 h-screen overflow-y-auto custom-scrollbar transition-all duration-300">
        <h2 id="menu-title" class="text-2xl font-bold text-gray-800 mb-6 w-full"></h2>
        <div id="nav-container" class="w-full"></div>
    </div>

    <!-- Contenuto a destra specifico -->
    <div class="flex-grow p-4 md:p-8 flex flex-col items-center pt-10 overflow-y-auto">
        
        <!-- Header del Profilo (Contiene Username, Bio, Immagine e Statistiche) -->
        <div class="bg-white p-6 rounded-3xl shadow-sm w-full max-w-md mb-10">
        
            <div class="flex items-center gap-4 mb-8">
                <!-- Immagine Profilo -->
                <div class="relative group cursor-pointer">
                    <img id="profile-img-display" src="https://i.ibb.co/b5HgvzCB/Spottio-Logo-2.png" 
                    class="w-20 h-20 rounded-2xl object-cover shadow-md border border-gray-100">
                    <input type="file" id="profile-image" accept="image/*" class="hidden">
                </div>
                
                <div class="text-left flex-grow">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <!-- Username -->
                            <h2 id="display-username" class="text-2xl font-bold text-gray-800"></h2>
                            <button id="edit-username-pencil" class="text-gray-400 hover:text-[#6a5cb3] transition-colors p-1" title="Modifica Username">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                                </svg>
                            </button>
                        </div>
                        
                        <a href="../impostazioni/impostazioni.html" class="p-2 text-gray-400 hover:text-gray-600 transition-colors" title="Impostazioni">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.525.293.93.55 1.065 1.066z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </a>
                    </div>
                    <!-- Bio -->
                    <div class="flex items-center gap-2 mt-1">
                        <p id="display-bio" class="text-gray-500 text-sm" data-translate="noBio">Nessuna bio impostata</p>
                        <button id="edit-bio-pencil" class="text-gray-400 hover:text-[#6a5cb3] transition-colors p-1" title="Modifica Bio">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Contatori Statistiche -->
            <div class="flex justify-around mb-4 py-2 border-t border-b border-gray-50">
                <div class="text-center p-2 rounded-xl">
                    <span id="post-count-number" class="block text-xl font-bold text-gray-800">0</span>
                    <span class="text-xs text-gray-500 font-semibold uppercase" data-translate="postWord">Post</span>
                </div>
                <div id="btn-show-followers" class="text-center cursor-pointer hover:bg-gray-100 p-2 rounded-xl transition duration-200">
                    <span id="follower-count" class="block text-xl font-bold text-gray-800">0</span>
                    <span class="text-xs text-gray-500 font-semibold uppercase" data-translate="followersText">Follower</span>
                </div>
                <div id="btn-show-following" class="text-center cursor-pointer hover:bg-gray-100 p-2 rounded-xl transition duration-200">
                    <span id="following-count" class="block text-xl font-bold text-gray-800">0</span>
                    <span class="text-xs text-gray-500 font-semibold uppercase" data-translate="followingText">Seguiti</span>
                </div>
            </div>

            <!-- Form Modifica Profilo -->
            <form id="profile-form" class="hidden space-y-4 pt-4 border-t border-gray-100">
                <div id="username-input-container" class="hidden">
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Nuovo Username</label>
                    <input type="text" id="image-username" class="w-full p-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-[#6a5cb3]">
                </div>
                
                <div id="bio-input-container" class="hidden">
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Nuova Bio</label>
                    <textarea id="image-caption" rows="2" class="w-full p-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-[#6a5cb3]"></textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg">
                    <span data-translate="saveBtn">Salva</span>
                </button>
            </form>
            <div id="status-message" class="mt-2 text-center text-sm font-medium"></div>
        </div>

        <!-- Contenitore Post (Usa la logica centralizzata) -->
        <div class="w-full max-w-4xl mx-auto p-4 flex flex-col items-center sm:items-start">
            <div id="posts-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
            </div>
        </div>

    </div>

    <!-- Modale Lista Follower/Following (Esclusivo del profilo) -->
    <div id="users-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-sm overflow-hidden flex flex-col max-h-[80vh] transform transition-all">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 id="modal-title" class="text-lg font-bold text-gray-800">Utenti</h3>
                <button id="close-modal-btn" class="text-gray-400 hover:text-red-500 transition-colors p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="modal-user-list" class="p-4 overflow-y-auto flex-grow flex flex-col gap-2"></div>
        </div>
    </div>

    <script src="../load-firebase.js"></script>
    <script src="../impostazioni/spottio-utils.js"></script>
    <script src="../pubblici/ui/ui-media-carousel.js"></script>
    <script src="../pubblici/ui/ui-renderer.js"></script>
    <script src="../pubblici/feed/feedAlgorithm.js"></script>
    <script src="../pubblici/feed/algorithm-interactions.js"></script>
    <script src="../pubblici/ui/ui-comments.js"></script>
    <script src="../pubblici/ui/ui-delete.js"></script>
    <script src="../pubblici/ui/ui-edit.js"></script>
    <script src="../pubblici/reports/reports.js"></script>
    <script src="profilo-translations.js"></script>

    <!-- Core -->
    <script src="core/profilo-core.js"></script>

    <!-- Features (Azioni e Modali) -->
    <script src="features/profilo-azioni.js"></script>
    <script src="features/profilo-modali.js"></script>

    <!-- Posts -->
    <script src="posts/carica-post-profilo.js"></script>
    <script src="../load-nav-scripts.js"></script>
    
</body>
</html>
