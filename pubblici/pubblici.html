<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spot</title>
    <link rel="icon" href="https://i.ibb.co/b5HgvzCB/Spottio-Logo-2.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="pubblici.css">
    <link rel="stylesheet" href="../impostazioni/body.css">
</head>
<body class="flex min-h-screen">
    <!-- Navigazione a sinistra -->
    <div id="sidebar-container" class="w-1/5 bg-white p-6 rounded-r-2xl shadow-xl flex flex-col justify-start items-start sticky top-0 h-screen overflow-y-auto custom-scrollbar transition-all duration-300">
        <h2 id="menu-title" class="text-2xl font-bold text-gray-800 mb-6 w-full"></h2>
        <div id="nav-container" class="w-full"></div>
    </div>
    
    <!-- Contenuto a destra specifico -->
    <div class="flex-grow p-8 flex justify-center overflow-y-auto">
        <div class="w-full max-w-2xl">

            <!-- TABS DI NAVIGAZIONE FEED -->
            <div class="flex justify-center mb-6 border-b border-gray-200">
                <button id="tab-explore" class="px-6 py-3 font-bold text-blue-600 border-b-2 border-blue-600 focus:outline-none transition">Esplora</button>
                <button id="tab-following" class="px-6 py-3 font-bold text-gray-400 border-b-2 border-transparent hover:text-gray-600 focus:outline-none transition">Seguiti</button>
            </div>

            <div id="posts-container">
                <div class="flex justify-center py-10">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                </div>
            </div>

        </div>
    </div>

    <script src="../load-firebase.js"></script>
    
    <!-- Aggiunto spottio-utils.js qui per iniettare i modali globali (incluso Report, Delete, Edit e Likes) -->
    
    <script src="ui/ui-media-carousel.js"></script>
    <script src="ui/ui-renderer.js"></script>
    <script src="ui/ui-comments.js"></script>
    <script src="ui/ui-delete.js"></script>
    <script src="ui/ui-edit.js"></script>
    
    <!-- Script Algoritmo Centralizzati -->
    <script src="feed/feedAlgorithm.js"></script>
    <script src="feed/algorithm-interactions.js"></script>
    
    <script src="feed/feed.js"></script>
    <script src="reports/reports.js"></script>
    <script src="../load-nav-scripts.js"></script>
</body>
</html>
